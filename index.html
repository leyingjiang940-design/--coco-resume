<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>姜乐颖-coco-resume</title>
<meta name="description" content="姜乐颖 coco 的椰子小岛——新媒体内容创作者的个人作品集">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2e4bd; --bg-deep:#ecd9a4;
  --ink:#43281a; --ink-soft:rgba(67,40,26,.62);
  --accent:#f5a300; --accent-deep:#e07f00;
  --leaf:#5f9e56; --sea:#5cb8ae;
  --card:#fffdf4; --line:rgba(67,40,26,.16);
  --shadow:0 14px 34px rgba(67,40,26,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);
  font:400 14px/1.9 "Noto Sans SC","Helvetica Neue",Arial,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:#fff}
a{color:inherit}img{max-width:100%;display:block}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}

#cur{position:fixed;z-index:9999;top:-11px;left:-11px;width:22px;height:22px;pointer-events:none;
  font-size:20px;line-height:22px;text-align:center;filter:drop-shadow(0 2px 2px rgba(67,40,26,.3));display:block}
@media(pointer:coarse){#cur{display:none}}
.paw-pop{position:fixed;z-index:9998;pointer-events:none;font-size:16px;animation:pawPop .8s ease-out forwards}
@keyframes pawPop{0%{opacity:.9;transform:translateY(0) scale(.7)}100%{opacity:0;transform:translateY(-34px) scale(1.15) rotate(14deg)}}

#prog{position:fixed;top:0;left:0;right:0;height:4px;z-index:997;pointer-events:none;opacity:0;transition:opacity .3s}
body.detail-open #prog{opacity:1}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-deep))}

/* 顶栏 */
.gheader{position:fixed;top:0;left:0;right:0;z-index:940;display:flex;align-items:center;gap:14px;padding:14px 24px;pointer-events:none}
.gheader .logo{display:flex;align-items:center;gap:9px;pointer-events:auto}
.gheader .logo .dot{width:11px;height:11px;background:var(--accent);border-radius:2px;transform:rotate(45deg)}
.gheader .logo b{font:900 16px/1 "Zen Maru Gothic","Noto Sans SC"}
.gheader .logo small{font:700 9.5px/1 "Zen Maru Gothic";letter-spacing:.28em;color:var(--ink-soft)}
.nav-pill{margin-left:auto;pointer-events:auto;display:flex;gap:2px;background:#fff;border-radius:99px;
  padding:5px 8px;box-shadow:0 8px 22px rgba(67,40,26,.12)}
.nav-pill a{text-decoration:none;font-size:12.5px;font-weight:700;color:var(--ink);
  padding:6px 13px;border-radius:99px;transition:.2s;white-space:nowrap}
.nav-pill a:hover{background:var(--accent);color:#fff}
.menu-button{margin-left:auto;pointer-events:auto;display:none;align-items:center;gap:9px;
  background:#fff;border-radius:99px;padding:11px 20px;font:700 12px/1 "Zen Maru Gothic";
  letter-spacing:.24em;box-shadow:0 8px 22px rgba(67,40,26,.12);transition:.25s}
.menu-button:hover{background:var(--accent);color:#fff}
.menu-button .bars{display:grid;gap:3px}
.menu-button .bars i{width:15px;height:2px;background:currentColor;border-radius:2px}
@media(max-width:1080px){.nav-pill{display:none}.menu-button{display:flex}}

.gmenu{position:fixed;inset:0;z-index:960;background:var(--ink);color:#fff;
  transform:translateY(-102%);transition:transform .6s cubic-bezier(.22,.8,.25,1);
  display:flex;flex-direction:column;justify-content:center;padding:90px 8vw 40px;overflow:auto}
.gmenu.open{transform:none}
.gmenu-close{position:absolute;top:16px;right:24px;color:#fff;font:700 12px/1 "Zen Maru Gothic";
  letter-spacing:.24em;background:rgba(255,255,255,.12);border-radius:99px;padding:12px 22px}
.gmenu-close:hover{background:var(--accent-deep)}
.gmenu nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 34px;max-width:900px}
.gmenu nav a{display:flex;align-items:baseline;gap:14px;text-decoration:none;padding:10px 6px;
  border-bottom:1px dashed rgba(255,255,255,.18);transition:.25s}
.gmenu nav a .en{font:900 clamp(22px,3.4vw,34px)/1.2 "Zen Maru Gothic";transition:.25s}
.gmenu nav a .zh{font-size:12.5px;color:rgba(255,255,255,.62);letter-spacing:.14em}
.gmenu nav a:hover .en{color:var(--accent);transform:translateX(8px)}
.gmenu-foot{margin-top:44px;font-size:12px;color:rgba(255,255,255,.55)}
.gmenu-foot b{color:rgba(255,255,255,.85)}

/* ===== 3D 场景 ===== */
.scene{position:fixed;inset:0;overflow:hidden;
  background:linear-gradient(180deg,#8fd0e8 0%,#c9e6ec 22%,#eaf2d8 42%,var(--bg) 62%,var(--bg-deep) 100%);
  transition:transform .65s cubic-bezier(.3,.7,.3,1),opacity .55s ease,filter .65s}
body.detail-open .scene{transform:scale(1.12);opacity:0;filter:blur(4px);pointer-events:none}
#stage{position:absolute;inset:0}
#stage canvas{display:block;cursor:grab}
#stage canvas.dragging{cursor:grabbing}
#stage canvas.hover-b{cursor:pointer}
.drag-hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);z-index:15;
  font-size:11.5px;letter-spacing:.18em;color:var(--ink-soft);background:rgba(255,253,244,.8);
  border:1.5px dashed var(--line);border-radius:99px;padding:6px 18px;pointer-events:none;transition:opacity .6s}
.drag-hint.hide{opacity:0}
.day-btn{position:fixed;bottom:24px;right:24px;z-index:960;width:54px;height:54px;border-radius:50%;
  background:var(--card);box-shadow:0 8px 22px rgba(67,40,26,.22);font-size:25px;line-height:54px;
  text-align:center;transition:.3s;border:1.5px solid var(--line)}
.day-btn:hover{transform:translateY(-3px) scale(1.06);box-shadow:0 14px 32px rgba(67,40,26,.3)}
.lang-btn{position:fixed;bottom:90px;right:24px;z-index:960;width:54px;height:54px;border-radius:50%;
  background:var(--card);box-shadow:0 8px 22px rgba(67,40,26,.22);font:800 15px/54px "Zen Maru Gothic";
  text-align:center;color:var(--ink);transition:.3s;border:1.5px solid var(--line)}
.lang-btn:hover{transform:translateY(-3px) scale(1.06);box-shadow:0 14px 32px rgba(67,40,26,.3)}
@media(pointer:coarse){.lang-btn{bottom:72px;right:16px;width:46px;height:46px;line-height:46px;font-size:13px}}
@media(pointer:coarse){.day-btn{bottom:16px;right:16px;width:46px;height:46px;line-height:46px;font-size:21px}}
/* 建筑 hover 浮空标签 */
.hover-label{position:fixed;z-index:970;pointer-events:none;transform:translate(-50%,-150%);
  background:var(--ink);color:#efe3c0;font:900 13px/1 "Zen Maru Gothic","Noto Sans SC";
  letter-spacing:.16em;text-transform:uppercase;padding:9px 15px;border-radius:11px;
  box-shadow:0 10px 24px rgba(67,40,26,.32);opacity:0;white-space:nowrap;
  transition:opacity .12s ease}
.hover-label.on{opacity:1}
.hover-label::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
  border:6px solid transparent;border-top-color:var(--ink);border-bottom:0}

/* 信息卡 */
.info-card{position:absolute;left:4vw;top:50%;transform:translateY(-58%);z-index:20;
  width:270px;background:#fff;border-radius:18px;padding:26px 26px 24px;
  box-shadow:0 18px 44px rgba(67,40,26,.16)}
.info-card .hello{font:700 10.5px/1 "Zen Maru Gothic";letter-spacing:.3em;color:var(--ink-soft);text-transform:uppercase}
.info-card .cat{margin-top:12px;font:900 19px/1.4 "Zen Maru Gothic","Noto Sans SC";color:var(--accent-deep)}
.info-card .cat-en{font:700 10.5px/1 "Zen Maru Gothic";letter-spacing:.32em;color:var(--ink-soft);text-transform:uppercase;margin-top:2px}
.info-card .tag{margin-top:14px;font-weight:900;font-size:16.5px;line-height:1.7;letter-spacing:.02em}
.info-card .desc{margin-top:8px;font-size:12px;line-height:1.95;color:var(--ink-soft)}
.info-card .more-btn{margin-top:16px;display:inline-flex;align-items:center;gap:10px;
  background:var(--accent);color:#fff;border-radius:99px;padding:11px 26px;
  font:700 12px/1 "Zen Maru Gothic";letter-spacing:.3em;text-decoration:none;transition:.25s}
.info-card .more-btn:hover{background:var(--accent-deep);transform:translateY(-2px)}
.info-card .card-dot{position:absolute;top:14px;right:14px;width:9px;height:9px;border-radius:50%;background:var(--ink);opacity:.85}
@media(max-width:1080px){
  .info-card{left:14px;right:14px;width:auto;top:auto;bottom:12px;transform:none;
    padding:16px 20px;border-radius:16px;display:grid;grid-template-columns:1fr auto;gap:2px 16px;align-items:center}
  .info-card .hello,.info-card .cat-en,.info-card .desc,.info-card .card-dot{display:none}
  .info-card .cat{margin:0;font-size:16px;grid-row:1}
  .info-card .tag{margin:0;font-size:12px;font-weight:700;grid-row:2}
  .info-card .more-btn{margin:0;grid-row:1/3;padding:10px 18px}
}

/* 详情 */
.detail{position:fixed;inset:0;z-index:900;background:var(--bg);overflow-y:auto;overflow-x:hidden;
  transform:translateY(70px) scale(.985);opacity:0;pointer-events:none;
  transition:transform .6s cubic-bezier(.22,.8,.3,1),opacity .45s ease}
body.detail-open .detail{transform:none;opacity:1;pointer-events:auto}
.home-fab{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);z-index:950;
  display:flex;align-items:center;gap:12px;background:#fff;border-radius:99px;padding:15px 34px;
  font:900 14px/1 "Zen Maru Gothic","Noto Sans SC";letter-spacing:.14em;
  box-shadow:0 12px 30px rgba(67,40,26,.22);opacity:0;pointer-events:none;transition:.45s cubic-bezier(.25,.8,.3,1)}
body.detail-open .home-fab{opacity:1;pointer-events:auto;transform:translateX(-50%)}
.home-fab:hover{background:var(--accent);color:#fff}
.home-fab .x{font-size:15px;font-weight:900}

.detail-inner{max-width:760px;margin:0 auto;padding:96px 22px 110px}
.page-head{text-align:center;margin-bottom:16px}
.sign-board{display:inline-block;position:relative;background:var(--ink);border-radius:12px;
  padding:14px 34px;border:3px solid #efe3c0;box-shadow:0 8px 20px rgba(67,40,26,.25);margin-bottom:26px}
.sign-board::before{content:"";position:absolute;inset:5px;border:2px dashed rgba(239,227,192,.5);border-radius:8px}
.sign-board span{font:900 clamp(16px,3vw,22px)/1 "Zen Maru Gothic";letter-spacing:.3em;color:#efe3c0;text-transform:uppercase}
.checker{width:64px;height:12px;margin:0 auto 14px;opacity:.9;
  background:
   conic-gradient(var(--accent) 90deg,transparent 90deg 180deg,var(--accent) 180deg 270deg,transparent 270deg) 0 0/8px 8px,
   conic-gradient(transparent 90deg,var(--accent) 90deg 180deg,transparent 180deg 270deg,var(--accent) 270deg) 4px 4px/8px 8px}
.page-head h1{font:900 clamp(28px,5vw,40px)/1.4 "Zen Maru Gothic","Noto Sans SC";margin:8px 0 4px}
.page-head .sub{color:var(--ink-soft);font-size:13.5px}

.reveal{opacity:0;transform:translateY(24px)}
.reveal.on{opacity:1;transform:none;transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.3,1)}

.msg p{margin-bottom:1.7em;font-size:15px}
.msg .sign{margin-top:2.4em;text-align:right;font-weight:700}
.msg .hl{background:linear-gradient(transparent 62%,rgba(245,163,0,.35) 62%);font-weight:700}
.edu-band{display:flex;align-items:center;gap:16px;background:var(--card);border:2px solid var(--line);
  border-radius:16px;padding:18px 24px;margin:30px 0}
.edu-band .y{font:900 20px/1 "Zen Maru Gothic";color:var(--accent-deep);white-space:nowrap}
.edu-band .arrow{color:var(--accent);font-weight:900}
.edu-band b{font-size:15px}
.edu-band small{display:block;color:var(--ink-soft);font-size:12.5px}

.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:26px 28px;margin-bottom:24px;transition:.3s}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.card-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:8px}
.card-head h3{font:700 17.5px/1.5 "Noto Sans SC"}
.card .role{font-size:11.5px;color:#fff;background:var(--accent);border-radius:99px;padding:2px 12px;font-weight:700}
.card .date{font:500 12px/1 "Zen Maru Gothic";color:var(--ink-soft);letter-spacing:.08em}
.card .sub{color:var(--ink-soft);font-size:13px;margin-bottom:12px}
.card ul{list-style:none;margin:6px 0 14px}
.card ul li{position:relative;padding-left:22px;margin-bottom:8px;font-size:13.5px}
.card ul li::before{content:"";position:absolute;left:3px;top:10px;width:8px;height:8px;background:var(--accent);transform:rotate(45deg)}
.works{display:flex;flex-wrap:wrap;gap:8px;border-top:1px dashed var(--line);padding-top:15px}
.works a,.works span{display:inline-flex;align-items:center;gap:6px;font-size:12px;
  background:rgba(245,163,0,.1);border:1.5px solid rgba(245,163,0,.4);color:var(--ink);
  border-radius:99px;padding:4px 13px;text-decoration:none;transition:.25s}
.works a:hover{background:var(--accent);color:#fff;transform:translateY(-2px)}

.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.gallery figure{margin:0;border-radius:12px;overflow:hidden;cursor:zoom-in;position:relative;border:2px solid var(--line);background:#fff}
.gallery img{width:100%;height:150px;object-fit:cover;transition:transform .4s}
.gallery figure:hover img{transform:scale(1.06)}
.gallery figcaption{position:absolute;left:0;right:0;bottom:0;font-size:11px;color:#fff;text-align:center;
  background:linear-gradient(transparent,rgba(67,40,26,.78));padding:18px 8px 6px}
@media(max-width:620px){.gallery{grid-template-columns:repeat(2,1fr)}.gallery img{height:118px}}

.skill-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;background:var(--card);
  border:2px solid var(--line);border-radius:16px;padding:18px 24px;margin-bottom:12px;transition:.3s}
.skill-row:hover{transform:translateX(6px);box-shadow:var(--shadow)}
.skill-row b{font-size:14.5px;min-width:150px}
.skill-row b::before{content:"🌴 "}
.skill-row span{color:var(--ink-soft);font-size:13px}
.life-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:620px){.life-grid{grid-template-columns:1fr}}
.life-card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:20px 22px;transition:.3s}
.life-card:hover{transform:translateY(-4px) rotate(-.6deg);box-shadow:var(--shadow)}
.life-card .emoji{font-size:25px}
.life-card b{display:block;margin:7px 0 2px;font-size:14.5px}
.life-card span{color:var(--ink-soft);font-size:12.5px}
.postcard{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;
  padding:38px 32px;text-align:center;overflow:hidden}
.postcard::before{content:"";position:absolute;top:0;left:0;right:0;height:10px;
  background:repeating-linear-gradient(90deg,var(--accent) 0 16px,transparent 16px 32px)}
.postcard .stamp{position:absolute;top:24px;right:24px;width:56px;height:66px;border:2px dashed var(--accent);
  border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;transform:rotate(4deg)}
.postcard .k{font:700 11px/1 "Zen Maru Gothic";letter-spacing:.34em;color:var(--ink-soft);text-transform:uppercase}
.postcard .rows{margin:20px 0;font-size:14.5px;line-height:2.4}
.postcard .rows a{text-decoration:none;color:var(--accent-deep);font-weight:700}
.postcard .wish{font-size:13px;color:var(--ink-soft)}

.gfooter{margin-top:70px;background:var(--ink);color:#fff;padding:44px 26px 110px}
.gfooter-in{max-width:760px;margin:0 auto;display:flex;flex-wrap:wrap;gap:20px 40px;align-items:flex-start}
.gfooter .fbrand b{font:900 16px/1 "Zen Maru Gothic","Noto Sans SC";display:block;margin-bottom:6px}
.gfooter .fbrand small{font-size:11.5px;color:rgba(255,255,255,.55)}
.gfooter nav{margin-left:auto;display:flex;flex-wrap:wrap;gap:4px 20px}
.gfooter nav a{font-size:12px;color:rgba(255,255,255,.75);text-decoration:none;letter-spacing:.1em}
.gfooter nav a:hover{color:var(--accent)}

#lightbox{position:fixed;inset:0;z-index:990;background:rgba(67,40,26,.78);display:flex;align-items:center;justify-content:center;
  padding:30px;opacity:0;pointer-events:none;transition:opacity .3s}
#lightbox.show{opacity:1;pointer-events:auto}
#lightbox img{max-height:88vh;max-width:92vw;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
#webglFail{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:5;text-align:center;padding:20px}
#webglFail.show{display:flex}

/* 猫向导引入 */
.intro{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(180deg,#bfe3e6 0%,#eaf2d8 34%,var(--bg) 70%);
  opacity:1;transition:opacity .8s ease;cursor:pointer}
.intro.done{opacity:0;pointer-events:none}
.intro-inner{text-align:center;padding:0 24px}
.intro-welcome{font:700 12px/1 "Zen Maru Gothic";letter-spacing:.5em;color:var(--ink-soft);text-transform:uppercase}
.intro-title{font:900 clamp(36px,8vw,62px)/1.15 "Zen Maru Gothic","Noto Sans SC";color:var(--ink);margin:16px 0 34px}
.intro-track{position:relative;height:66px;width:min(430px,82vw);margin:0 auto;overflow:hidden}
.intro-cat{position:absolute;left:0;top:6px;font-size:46px;line-height:1;filter:drop-shadow(0 4px 4px rgba(67,40,26,.25));
  animation:catWalk 2.6s ease-in-out forwards}
@keyframes catWalk{0%{left:-70px}100%{left:calc(100% - 26px)}}
.intro-paw{position:absolute;bottom:0;font-size:18px;color:var(--accent);opacity:0;
  animation:pawStep 2.6s ease-out forwards}
.intro-paw.p1{left:7%;animation-delay:.18s}
.intro-paw.p2{left:24%;animation-delay:.5s}
.intro-paw.p3{left:41%;animation-delay:.82s}
.intro-paw.p4{left:58%;animation-delay:1.14s}
.intro-paw.p5{left:75%;animation-delay:1.46s}
@keyframes pawStep{0%{opacity:0;transform:scale(.3) rotate(22deg)}14%{opacity:.9;transform:scale(1) rotate(-8deg)}100%{opacity:.65;transform:scale(.92) rotate(0)}}
.intro-tip{margin-top:26px;font-size:15px;font-weight:900;color:var(--ink)}
.intro-skip{margin-top:44px;font:700 12px/1 "Zen Maru Gothic";letter-spacing:.22em;color:var(--ink-soft);
  border:1.5px dashed var(--line);border-radius:99px;padding:10px 24px;transition:.2s}
.intro-skip:hover{color:var(--ink);background:rgba(255,255,255,.55)}
</style>
</head>
<body>

<div id="cur">🐾</div>
<div id="prog"><i></i></div>

<div class="intro" id="intro">
  <div class="intro-inner">
    <p class="intro-welcome">Coco's Island</p>
    <h1 class="intro-title">椰子小岛</h1>
    <div class="intro-track">
      <span class="intro-cat">🐈</span>
      <span class="intro-paw p1">🐾</span>
      <span class="intro-paw p2">🐾</span>
      <span class="intro-paw p3">🐾</span>
      <span class="intro-paw p4">🐾</span>
      <span class="intro-paw p5">🐾</span>
    </div>
    <p class="intro-tip">小猫带你上岛逛逛～</p>
  </div>
  <button class="intro-skip">点击任意处开始探索</button>
</div>

<header class="gheader">
  <a class="logo" href="#" onclick="return false">
    <span class="dot"></span><b>椰子小岛</b><small>COCO'S ISLAND</small>
  </a>
  <nav class="nav-pill" id="navPill"></nav>
  <button class="menu-button" id="menuOpen"><span class="bars"><i></i><i></i><i></i></span>MENU</button>
</header>

<div class="gmenu" id="gmenu">
  <button class="gmenu-close" id="menuClose">CLOSE ✕</button>
  <nav id="menuNav"></nav>
  <p class="gmenu-foot"><b>姜乐颖 coco</b>｜上海外国语大学 · 德语语言文学｜上海 · 可远程协作</p>
</div>

<!-- ===== 3D 城镇场景 ===== -->
<div class="scene" id="scene">
  <div id="stage"></div>
  <div id="webglFail"></div>

  <aside class="info-card" id="infoCard">
    <span class="card-dot"></span>
    <p class="hello">Coco's Island</p>
    <p class="cat" id="icCat">社团经历</p>
    <p class="cat-en" id="icEn">Club</p>
    <p class="tag" id="icTag">岛上最早扎根的<br>两棵椰子树</p>
    <p class="desc" id="icDesc"></p>
    <a class="more-btn" id="icMore" href="#club">More</a>
  </aside>

function tower(g,{w,d,floors,fh,wall,side,win,roof}){
  const H=floors*fh;
  box(g,wall,0,H/2,0,w,H,d);
  box(g,side,0,H+.09,0,w+.22,.18,d+.22);           /* 檐 */
  for(let i=0;i<floors;i++){
    const z0=.06,fy=fh*i+fh*.55;
    for(const sx of[-1,1]){                          /* 前后窗 */
      wbox(g,win,sx*w*.24,fy,d/2+z0, w*.26,fh*.42,.05);
      wbox(g,win,sx*w*.24,fy,-d/2-z0, w*.26,fh*.42,.05);
    }
    for(const sz of[-1,1]){                          /* 左右窗 */
      wbox(g,win,w/2+z0,fy,sz*d*.24, .05,fh*.42,d*.26);
      wbox(g,win,-w/2-z0,fy,sz*d*.24, .05,fh*.42,d*.26);
    }
  }
  box(g,'#b08147',0,.5,d/2+.14,w*.34,1,d*.3).scale.set(w*.34,1,.12); /* 门 */
  if(roof)roof(g,H);
  return H;
}

const signTex={};
function signFor(key){

    g2.beginPath();g2.roundRect(18,18,476,92,12);g2.stroke();

    g2.fillText(txt,256,68);

(function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
  /* 相机 */
  if(cam.fly){
    cam.fly.t+=dt/.85;
    const k=ease(Math.min(1,cam.fly.t));
    const f=cam.fly.from,o=cam.fly.to;
    cam.theta=f.theta+(o.theta-f.theta)*k;
    cam.phi=f.phi+(o.phi-f.phi)*k;
    cam.dist=f.dist+(o.dist-f.dist)*k;
    cam.tgt.lerpVectors(f.tgt,o.tgt,k);
    if(cam.fly.t>=1)cam.fly=null;
  }else{
    cam.theta+=(cam.tTheta-cam.theta)*.09;
    cam.phi+=(cam.tPhi-cam.phi)*.09;
    cam.dist+=(cam.tDist-cam.dist)*.09;
  }
  applyCam();
  /* 昼夜过渡 */
  day+=(dayTarget-day)*.03;
  ambient.intensity=lerp(.6,.25,day);
  hemi.intensity=lerp(.55,.18,day);
  sun.intensity=lerp(1.25,.15,day);
  sun.color.set('#ffffff').lerp(nightSunColor,day);
  ambient.color.set('#fff6e0').lerp(nightAmbColor,day);
  for(const m of nightMats)m.emissiveIntensity=day*.95;
  const isNight=day>.5;
  sunMesh.visible=!isNight;sunGlow.visible=!isNight;moonMesh.visible=isNight;starGroup.visible=isNight;
  sceneEl.style.background=skyGradient(day);
  /* 海鸟绕飞 */
  birds.forEach(bd=>{
    const a=bd.a0+t*bd.sp;
    bd.g.position.set(Math.cos(a)*bd.r, bd.y+Math.sin(t*2.2+bd.r)*.5, Math.sin(a)*bd.r);
    bd.g.rotation.y=-a;
  });
  /* 摩天轮 */
  wheel.rotation.z+=dt*.32;
  cabins.forEach(c=>c.rotation.z=-wheel.rotation.z);
  /* 夜间烟花：火箭升空 -> 爆发 -> 条纹坠落渐隐 */
  if(isNight){
    fwTimer-=dt;
    if(fwTimer<=0){launchRocket();fwTimer=.9+Math.random()*1.5;}
  }else{
    while(rockets.length){const r=rockets.pop();scene.remove(r.m);scene.remove(r.trail);}
    while(fireworks.length){const f=fireworks.pop();f.streaks.forEach(s=>scene.remove(s.m));if(f.flash)scene.remove(f.flash);}
  }
  for(let i=rockets.length-1;i>=0;i--){
    const r=rockets[i];
    r.m.position.y+=r.vy*dt;
    r.trail.position.y=r.m.position.y-.75;
    r.trail.material.opacity=.6*Math.min(1,r.m.position.y/4);
    if(r.m.position.y>=r.burstY){
      scene.remove(r.m);scene.remove(r.trail);
      burstFirework(r);rockets.splice(i,1);
    }
  }
  for(let i=fireworks.length-1;i>=0;i--){
    const f=fireworks[i];f.age+=dt;
    if(f.flash){
      f.flash.scale.setScalar(1+f.age*7);
      f.flash.material.opacity=Math.max(0,1-f.age/.32);
      if(f.age>.32){scene.remove(f.flash);f.flash=null;}
    }
    let alive=false;
    for(const p of f.streaks){
      p.life+=dt;
      const dg=Math.max(0,1-1.2*dt);
      p.vx*=dg; p.vy=p.vy*dg-2.6*dt; p.vz*=dg;
      p.m.position.x+=p.vx*dt; p.m.position.y+=p.vy*dt; p.m.position.z+=p.vz*dt;
      const sp2=p.vx*p.vx+p.vy*p.vy+p.vz*p.vz;
      if(sp2>.02)p.m.lookAt(p.m.position.x+p.vx,p.m.position.y+p.vy,p.m.position.z+p.vz);
      const o=Math.max(0,1-p.life/2);
      p.m.material.opacity=o; p.m.scale.z=Math.max(.06,.9*o);
      if(p.life<2)alive=true;
    }
    if(!alive&&f.age>.4){f.streaks.forEach(s=>scene.remove(s.m));fireworks.splice(i,1);}
  }
  /* 小火车 */
  trainT=(trainT+dt*.016)%1;
  cars.forEach((car,i)=>{
    const tt=(trainT+i*.028)%1;
    const p=curve.getPointAt(tt),p2=curve.getPointAt((tt+.002)%1);
    car.position.set(p.x,0,p.z);
    car.lookAt(p2.x,0,p2.z);
  });
  /* 海水浪花 */
  surf.scale.setScalar(1+Math.sin(t*1.7)*.03);
  surf2.scale.setScalar(1+Math.sin(t*1.7+1.3)*.045);
  waves.forEach((w,i)=>{w.m.scale.setScalar(.75+Math.abs(Math.sin(t*2.2+i*.6))*.5);w.m.position.y=-1.46+Math.sin(t*2.2+i*.6)*.05});
  /* 飞机拖横幅绕岛飞行 */
  planeT=(planeT+dt*.045)%1;
  {
    const pa=planeT*Math.PI*2;
    const pr=10.5, py=9+Math.sin(pa*2)*.5;
    const px=Math.cos(pa)*pr, pz=Math.sin(pa)*pr;
    const tx=-Math.sin(pa), tz=Math.cos(pa);
    plane.position.set(px,py,pz);
    plane.lookAt(px+tx,py,pz+tz);
    plane.rotation.z+=.34;
    if(plane.userData.prop)plane.userData.prop.rotation.z+=dt*18;
    banner.position.set(px-tx*2.3, py-.15, pz-tz*2.3);
  }
  /* 云 */
  clouds.forEach(c=>{c.g.position.x+=c.v;if(c.g.position.x>14)c.g.position.x=-14});
  /* 飘浮方块 */
  cubes3.forEach(c=>{c.m.position.y=c.y0+Math.sin(t*1.4+c.ph)*.35;c.m.rotation.y+=dt*.6});
  /* hover 楼浮动（夸张：抬升 + 放大 + 摇摆） */
  for(const [k,b] of Object.entries(builds)){
    const on=(k===hoverKey);
    const tY=on?0.5:0, tS=on?1.16:1;
    b.group.position.y+=(tY-b.group.position.y)*.16;
    const s=b.group.scale.x+(tS-b.group.scale.x)*.16;
    b.group.scale.set(s,s,s);
    const tilt=on?Math.sin(t*6)*.06:0;
    b.group.rotation.z+=(tilt-b.group.rotation.z)*.12;
  }
  renderer.render(scene,camera);
  if(!introFired){introFired=true;if(window.__introsFinish)setTimeout(window.__introsFinish,450)}
})();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
})();
</script>
</body>
</html>
